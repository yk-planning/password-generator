name: Inspect Cloudflare (temporary)
on: workflow_dispatch
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          A=df73478b7c65d7996d842f66d91314e4
          echo "== token verify"; curl -s -H "Authorization: Bearer $CF_TOKEN" https://api.cloudflare.com/client/v4/user/tokens/verify | jq -c '{success, status: .result.status}'
          echo "== pages projects"; curl -s -H "Authorization: Bearer $CF_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$A/pages/projects" | jq -c '{success, errors, names: [.result[]?.name]}'
          echo "== workers scripts"; curl -s -H "Authorization: Bearer $CF_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$A/workers/scripts" | jq -c '{success, errors, names: [.result[]?.id]}'
